# Reverse-proxy: весь входящий трафик на порту 80 перенаправляется в
# контейнер api. Это каркас без SSL — когда появится настоящий домен и
# сервер, сюда добавляется блок для Let's Encrypt (certbot) и редирект
# на 443/https. См. README, раздел "Следующий шаг: домен и HTTPS".

server {
    listen 80;
    server_name _;

    # Реальный IP клиента и протокол — иначе за прокси всё выглядело бы
    # так, будто все запросы идут с одного внутреннего IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://api:8000;
    }
}
